<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradePulse AI Scanner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111f;
      color: #ffffff;
      line-height: 1.5;
    }

    header {
      background: #0b1b2d;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #21344a;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #00e5a8;
    }

    .hero {
      padding: 50px 20px;
      text-align: center;
      background: linear-gradient(180deg, #10253d, #07111f);
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: #00e5a8;
    }

    .hero p {
      color: #b7c5d6;
      max-width: 650px;
      margin: auto;
    }

    .buttons {
      margin-top: 25px;
    }

    button,
    .button {
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin: 5px;
    }

    .primary {
      background: #00e5a8;
      color: #07111f;
    }
